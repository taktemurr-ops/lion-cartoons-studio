name: Episode catalog validation
on:
  push:
    paths:
      - 'content/**'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/catalog-check.yml'
  pull_request:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate episode metadata
        run: python scripts/validate_catalog.py
